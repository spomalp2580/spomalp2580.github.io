<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio VR · Física UCE</title>
<meta name="theme-color" content="#121b26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="usuarios.js"></script>
<style>
  :root {
    --bg: #121b26; --card: #1b2836; --card-hi: #243549;
    --text: #eef3f8; --muted: #9fb0c2; --accent: #5aa9ff; --error: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }

  /* ---------- Ingreso ---------- */
  #ingreso { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
  .login { width: 100%; max-width: 520px; background: var(--card); border-radius: 26px; padding: 44px 40px; }
  .login img { width: 88px; height: 88px; border-radius: 20px; display: block; margin-bottom: 18px; }
  .login h1 { font-size: 2.2rem; margin: 0 0 6px; }
  .login .sub { font-size: 1.15rem; color: var(--muted); margin: 0 0 30px; }
  label { display: block; font-size: 1.15rem; font-weight: 600; margin: 0 0 8px; }
  input[type=text], input[type=password] {
    width: 100%; min-height: 64px; padding: 0 20px; margin-bottom: 22px;
    font-size: 1.35rem; color: var(--text); background: #0f1720;
    border: 2px solid #34485e; border-radius: 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  .recordar { display: flex; align-items: center; gap: 14px; font-size: 1.15rem; margin: 2px 0 26px; cursor: pointer; }
  .recordar input { width: 30px; height: 30px; accent-color: var(--accent); }
  .msg { min-height: 1.6em; font-size: 1.1rem; color: var(--error); margin: -6px 0 14px; }

  /* ---------- Botones ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center;
    min-height: 64px; padding: 0 28px; border-radius: 16px;
    font-size: 1.3rem; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--accent); color: #08121d; }
  .btn.ghost { background: transparent; color: var(--text); border: 2px solid #3a4f66; }
  .btn.full { width: 100%; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- Simuladores ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 36px; }
  .head h1 { font-size: 2.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .head p { font-size: 1.25rem; color: var(--muted); margin: 0; }
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 14px; background: var(--card); border-radius: 22px; padding: 28px;
    border: 2px solid transparent; transition: background .15s, border-color .15s, transform .15s; }
  .card:hover, .card:focus-within { background: var(--card-hi); border-color: var(--accent); transform: translateY(-2px); }
  .top { display: flex; align-items: center; gap: 18px; }
  .emoji { font-size: 3rem; line-height: 1; }
  .card h2 { font-size: 1.7rem; margin: 0; }
  .card p { font-size: 1.15rem; color: var(--muted); margin: 0; flex: 1; line-height: 1.45; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .actions .primary { flex: 1; }
  .tag { font-size: .95rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  footer { margin-top: 40px; color: var(--muted); font-size: 1rem; }
  body.in-headset .send { display: none; }
</style>
</head>
<body>

<!-- ================= PANTALLA DE INGRESO ================= -->
<section id="ingreso" hidden>
  <form class="login" id="form" autocomplete="on">
    <img src="icon-192.png" alt="">
    <h1>Laboratorio VR</h1>
    <p class="sub">Centro de Física · UCE — ingresa para ver los simuladores</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label for="clave">Contraseña</label>
    <input id="clave" name="password" type="password" autocomplete="current-password" required>

    <label class="recordar"><input type="checkbox" id="recordar" checked> Mantener la sesión en este dispositivo</label>

    <div class="msg" id="msg" role="alert"></div>
    <button class="btn primary full" type="submit">Ingresar</button>
  </form>
</section>

<!-- ================= LISTA DE SIMULADORES ================= -->
<main id="panel" hidden>
  <div class="head">
    <div>
      <h1>Laboratorio VR · Física</h1>
      <p id="saludo">Simuladores de prácticas — Centro de Física, UCE</p>
    </div>
    <button class="btn ghost" id="salir" type="button">Cerrar sesión</button>
  </div>
  <section class="grid" id="grid"></section>
  <footer id="foot"></footer>
</main>

<script>
/* ============================================================
   LISTA DE SIMULADORES
   Para añadir uno nuevo, copia un bloque { ... } y cambia los datos.
   Recuerda poner también la línea de guardia.js en su index.html.
   ============================================================ */
const SIMULADORES = [
  {
    nombre: "Teorema de Bernoulli",
    tema: "Fluidos",
    emoji: "💧",
    descripcion: "Tubo de Venturi: presión y velocidad del fluido a lo largo del conducto.",
    url: "https://spomalp2580.github.io/bernoulli-vr/"
  },
  {
    nombre: "Líneas equipotenciales",
    tema: "Electrostática",
    emoji: "⚡",
    descripcion: "Mapeo del potencial eléctrico entre electrodos y trazado de equipotenciales.",
    url: "https://spomalp2580.github.io/equipotenciales-vr/"
  },
  // { nombre: "Nuevo simulador", tema: "…", emoji: "🔬", descripcion: "…",
  //   url: "https://spomalp2580.github.io/nuevo-vr/" },
];

/* Duración de la sesión */
const HORAS_SIN_RECORDAR = 8;     // una jornada de clase
const DIAS_RECORDANDO   = 30;

const CLAVE_SESION = "labvr_sesion";
const enVisor = /OculusBrowser|Quest/i.test(navigator.userAgent);
if (enVisor) document.body.classList.add("in-headset");

const $ = (id) => document.getElementById(id);

function leerSesion() {
  try {
    const s = JSON.parse(localStorage.getItem(CLAVE_SESION) || "null");
    if (s && s.u && s.exp > Date.now() && window.USUARIOS && USUARIOS[s.u]) return s;
  } catch (e) {}
  return null;
}

async function huella(usuario, clave) {
  const datos = new TextEncoder().encode("labvr|" + usuario + "|" + clave);
  const h = await crypto.subtle.digest("SHA-256", datos);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* Solo se vuelve a direcciones de este mismo sitio */
function destinoTrasIngreso() {
  const v = new URLSearchParams(location.search).get("volver");
  if (!v) return null;
  try {
    const u = new URL(v);
    if (u.origin === location.origin) return u.href;
  } catch (e) {}
  return null;
}

function mostrarIngreso() {
  $("panel").hidden = true;
  $("ingreso").hidden = false;
  setTimeout(() => $("usuario").focus(), 50);
}

function mostrarPanel(sesion) {
  $("ingreso").hidden = true;
  $("panel").hidden = false;
  $("saludo").textContent = "Sesión iniciada como «" + sesion.u + "» — Centro de Física, UCE";
  const grid = $("grid");
  grid.innerHTML = "";
  for (const s of SIMULADORES) {
    const card = document.createElement("article");
    card.className = "card";
    const webLaunch = "https://www.oculus.com/open_url/?url=" + encodeURIComponent(s.url);
    card.innerHTML = `
      <div class="top">
        <span class="emoji" aria-hidden="true">${s.emoji}</span>
        <div><div class="tag">${s.tema}</div><h2>${s.nombre}</h2></div>
      </div>
      <p>${s.descripcion}</p>
      <div class="actions">
        <a class="btn primary" href="${s.url}">Abrir</a>
        <a class="btn ghost send" href="${webLaunch}" target="_blank" rel="noopener"
           title="Abre este simulador en tus Meta Quest desde el PC o el móvil">Enviar a las gafas</a>
      </div>`;
    grid.appendChild(card);
  }
  $("foot").textContent = enVisor
    ? "Consejo: dentro de cada simulador pulsa el botón de entrar en VR."
    : "Desde el PC o el móvil, «Enviar a las gafas» abre el simulador en tus Meta Quest (allí también te pedirá ingresar).";
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const usuario = $("usuario").value.trim().toLowerCase();
  const clave = $("clave").value;
  $("msg").textContent = "";
  const esperado = window.USUARIOS && USUARIOS[usuario];
  const ok = esperado && (await huella(usuario, clave)) === esperado;
  if (!ok) {
    $("msg").textContent = "Usuario o contraseña incorrectos.";
    $("clave").value = "";
    $("clave").focus();
    return;
  }
  const dur = $("recordar").checked ? DIAS_RECORDANDO * 864e5 : HORAS_SIN_RECORDAR * 36e5;
  const sesion = { u: usuario, exp: Date.now() + dur };
  localStorage.setItem(CLAVE_SESION, JSON.stringify(sesion));
  $("clave").value = "";
  const volver = destinoTrasIngreso();
  if (volver) { location.replace(volver); return; }
  mostrarPanel(sesion);
});

$("salir").addEventListener("click", () => {
  localStorage.removeItem(CLAVE_SESION);
  history.replaceState(null, "", location.pathname);
  mostrarIngreso();
});

/* Arranque */
const sesion = leerSesion();
if (sesion) {
  const volver = destinoTrasIngreso();
  if (volver) location.replace(volver); else mostrarPanel(sesion);
} else {
  localStorage.removeItem(CLAVE_SESION);
  mostrarIngreso();
}
</script>
</body>
</html>
